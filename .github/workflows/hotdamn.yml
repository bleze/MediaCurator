name: Hot DAMN NFO Viewer

# The standalone NFO viewer (apps/hotdamn) is its own CMake project with its
# own version and installer. Kept out of build.yml on purpose: that workflow's
# release job attaches every artifact of the run to the MediaCurator release,
# and this installer is not part of one.
#
# Releases use their own tag prefix, hotdamn-vX.Y.Z, which build.yml's 'v*'
# trigger does not match. (Path filters below are not applied to tag pushes.)
on:
  push:
    branches: [ main, develop, hotdamn, 'hotdamn/**' ]
    tags: [ 'hotdamn-v*' ]
    paths:
      - 'apps/hotdamn/**'
      - 'libs/nfoview/**'
      - '.github/workflows/hotdamn.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/hotdamn/**'
      - 'libs/nfoview/**'
      - '.github/workflows/hotdamn.yml'
  workflow_dispatch:

# See build.yml for why this is needed (msvc-dev-cmd has no Node.js 24 build yet).
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows (MSVC x64)

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Set up MSVC (x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: >
        cmake -S apps/hotdamn -B apps/hotdamn/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        -DQt6_DIR="${{ env.Qt6_DIR }}"

    - name: Build
      run: cmake --build apps/hotdamn/build --parallel

    - name: Cache Chocolatey NSIS package
      uses: actions/cache@v6
      with:
        path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey
        key: choco-nsis

    - name: Install NSIS
      run: |
        choco install nsis -y --no-progress
        echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Package (NSIS installer)
      run: cpack --config apps/hotdamn/build/CPackConfig.cmake -C Release -B apps/hotdamn/build/packages

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: HotDamn-Windows-Installer
        path: apps/hotdamn/build/packages/HotDamn-Setup-*.exe
        if-no-files-found: error

  # Runs only on hotdamn-vX.Y.Z tag pushes: publishes the installer as a GitHub
  # Release in this repository.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/hotdamn-v')
    runs-on: ubuntu-latest
    name: Publish release
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download installer
      uses: actions/download-artifact@v8
      with:
        name: HotDamn-Windows-Installer
        path: artifacts

    # The installer's version comes from project(VERSION) in
    # apps/hotdamn/CMakeLists.txt; a tag that disagrees with it would publish
    # a release whose name and contents don't match.
    - name: Check tag matches the built version
      id: version
      run: |
        version="${GITHUB_REF_NAME#hotdamn-v}"
        if [ ! -f "artifacts/HotDamn-Setup-${version}.exe" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match the built installer:"; ls artifacts; exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    # The release notes are this version's section of apps/hotdamn/CHANGELOG.md
    # (also what Hot DAMN's update prompt shows), so a release without one fails
    # here rather than going out with no notes.
    - name: Release notes from the changelog
      run: bash .github/scripts/hotdamn-release-notes.sh "${{ steps.version.outputs.version }}" | tee notes.md

    # make_latest must stay false. MediaCurator's in-app updater and the
    # README download link both use this repository's "latest release" and take
    # its first .exe; a Hot DAMN release marked latest would be offered to
    # every MediaCurator user as their update.
    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        name: Hot DAMN NFO Viewer ${{ steps.version.outputs.version }}
        files: artifacts/HotDamn-Setup-*.exe
        make_latest: 'false'
        fail_on_unmatched_files: true
        body_path: notes.md
